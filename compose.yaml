services:
  provider-fake:
    build: ./provider-fake
    env_file:
      - path: .env
        required: false
    ports:
      - "8090:8090"

  hr-fake:
    build: ./hr-fake
    ports:
      - "8091:8091"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: vereda
      POSTGRES_PASSWORD: vereda
      POSTGRES_DB: vereda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vereda -d vereda"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.16.0
    ports:
      - "16686:16686"

  # Único caminho dos traces até o Jaeger: redige CPF e salário antes de exportar (ADR 0005).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    depends_on:
      jaeger:
        condition: service_started

  app:
    build: ./app
    env_file:
      - path: .env
        required: false
    environment:
      # Uma configuração só decide a captura de conteúdo nos traces (ADR 0005):
      # production (padrão) não captura nada; development captura as mensagens enviadas ao modelo.
      # Para subir em development: APP_ENV=development docker compose up -d --wait app
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://vereda:vereda@postgres:5432/vereda
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      provider-fake:
        condition: service_healthy
      hr-fake:
        condition: service_healthy
      otel-collector:
        condition: service_started

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
