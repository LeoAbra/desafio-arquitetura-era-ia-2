# Gate de qualidade (ADR 0006): sobe o ambiente do compose e roda o gate pareado com a baseline v1.
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Subir o ambiente
        run: |
          cp .env.example .env
          docker compose down -v
          docker compose up -d --build --wait
          curl -sf localhost:8000/health

      - name: Gate
        run: python evals/gate.py

      - name: Logs dos serviços
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Relatório da suíte
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gate-report
          path: evals/reports/
          if-no-files-found: ignore

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
