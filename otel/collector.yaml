# OpenTelemetry Collector: o único caminho entre a aplicação e o Jaeger.
# A aplicação decide O QUE capturar (por APP_ENV); o Collector é a última barreira antes
# do backend e redige CPF e salário de qualquer atributo, em qualquer ambiente (ADR 0005).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Redação de dados pessoais. Strings OTTL em aspas duplas, instrução inteira em aspas
  # simples no YAML, cada "\" da regex dobrada e grupo de captura escrito $${1}.
  transform/redact_pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # CPF em qualquer atributo do span
          - 'replace_all_patterns(attributes, "value", "\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}", "[CPF REDIGIDO]")'
          # valor que segue a palavra salário/salary (texto ou JSON)
          - 'replace_all_patterns(attributes, "value", "(?i)(sal[aá]rio|salary)([^0-9]{0,12})[0-9][0-9.]*,[0-9]{2}", "$${1}$${2}[SALARIO REDIGIDO]")'
          # qualquer valor monetário com milhar (R$ 4.850,00): salários do hr-fake e afins
          - 'replace_all_patterns(attributes, "value", "\\d{1,3}(\\.\\d{3})+,\\d{2}", "[VALOR REDIGIDO]")'
          - 'replace_pattern(name, "\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}", "[CPF REDIGIDO]")'
      - context: spanevent
        statements:
          - 'replace_all_patterns(attributes, "value", "\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}", "[CPF REDIGIDO]")'
          - 'replace_all_patterns(attributes, "value", "(?i)(sal[aá]rio|salary)([^0-9]{0,12})[0-9][0-9.]*,[0-9]{2}", "$${1}$${2}[SALARIO REDIGIDO]")'
          - 'replace_all_patterns(attributes, "value", "\\d{1,3}(\\.\\d{3})+,\\d{2}", "[VALOR REDIGIDO]")'
  batch:
    timeout: 1s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/redact_pii, batch]
      exporters: [otlp/jaeger]
